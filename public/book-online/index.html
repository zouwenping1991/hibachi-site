<form id="bookingForm">
<p><label>May we have your first and last name please? *</label><br>

<small>Please enter full address for travel calculation</small><br><br></p>
  <!-- Guests -->

<input type="number" name="guests" required style="width:100%;padding:10px;"><br><br></p>

<script>
document.getElementById("bookingForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const submitBtn = this.querySelector("button");
  submitBtn.disabled = true;
  submitBtn.innerText = "Calculating...";

  const data = {
    fullname: this.fullname.value,
    email: this.email.value,
    phone: this.phone.value,
    contact: this.contact.value,
    date: this.date.value,
    time: this.time.value,
    address: this.address.value,
    guests: this.guests.value
  };

  try {

    const res = await fetch("https://hibachi-backend-5rfq.onrender.com/book", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (result.success) {

      alert(
        "Booking Request Sent!\n\n" +
        "Distance: " + result.distanceMiles + " miles\n" +
        "Travel Fee: $" + result.travelFee
      );

      this.reset();

    } else {

      alert(result.message || "Failed to send booking");

    }

  } catch (err) {

    alert("Server error");

  }

  submitBtn.disabled = false;
  submitBtn.innerText = "Submit Booking Request";

});
</script>

<script>

        menu.onscroll = function () {

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
